x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: crypto-sentiment-api:latest
    logging: *default-logging
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crypto
    depends_on:
      db:
        condition: service_healthy

  api:
    image: crypto-sentiment-api:latest
    restart: unless-stopped
    logging: *default-logging
    command: uvicorn src.presentation.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crypto
    ports:
      - "8002:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    image: crypto-sentiment-ui:latest
    restart: unless-stopped
    logging: *default-logging
    command: streamlit run run_app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crypto
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  ingest-worker:
    image: crypto-sentiment-api:latest
    restart: unless-stopped
    logging: *default-logging
    command: python -m src.app.jobs.scheduled_ingest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crypto
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
