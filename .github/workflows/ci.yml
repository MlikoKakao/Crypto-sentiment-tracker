name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crypto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/crypto_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[api,fetchers,sentiment,dev]"

      - name: Run tests
        run: pytest

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.api -t crypto-sentiment-api:latest .
          docker build -f Dockerfile.ui -t crypto-sentiment-ui:latest .
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_TAILSCALE_HOST }}

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/pi_key
          chmod 600 ~/.ssh/pi_key

      - name: Deploy on Raspberry Pi
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/pi_key \
            ${{ secrets.PI_USER }}@${{ secrets.PI_TAILSCALE_HOST }} \
            "cd /home/raspberrypi/apps/Crypto-sentiment-tracker && \
            git pull --ff-only && \
            docker build -f Dockerfile.api -t crypto-sentiment-api:latest . && \
            docker build -f Dockerfile.ui -t crypto-sentiment-ui:latest . && \
            docker compose up -d db && \
            docker compose run --rm migrate && \
            docker compose up -d api ui ingest-worker"