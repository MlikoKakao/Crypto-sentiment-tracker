[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coin-sentiment"
version = "0.1.0"
description = "Coin Sentiment analysis app with Streamlit, FastAPI and PostgreSQL storage."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "alembic",
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "python-dotenv",
    "pytz",
    "pydantic",
    "statsmodels",
    "sqlalchemy",
    "psycopg[binary]",
    "psycopg2-binary",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn[standard]",
]

ui = [
    "streamlit",
    "plotly",
]

fetchers = [
    "praw",
    "google-api-python-client",
    "feedparser",
]

sentiment = [
    "nltk",
    "textblob",
    "vaderSentiment",
]

ml = [
    "torch",
    "transformers<5",
]

dev = [
    "pytest",
    "mypy",
    "pandas-stubs",
    "plotly-stubs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
mypy_path = "stubs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
